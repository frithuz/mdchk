name: Go

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Check resource schema with ECMAScript regex engine
        run: node tools/resource_schema.mjs
      - name: Test
        run: go test ./...
      - name: Test actual GFM AST adapter and scope controls
        run: go test -tags mdchk_conformance ./internal/conformance/... -count=1 -v
      - name: Test closed GFM scopes preserve production admission
        run: go test -tags mdchk_conformance ./internal/cli -run '^TestGFMPrivateScopesPreserveProductionAdmission$' -count=1
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: sh tools/lint.sh
      - name: Verify lint gate detects violations
        run: sh tools/lint.sh --self-test
      - name: Check CommonMark corpus
        run: python3 -B tools/commonmark_corpus.py --check
      - name: Check pinned published GFM corpus
        run: python3 -B tools/gfm_corpus.py --check
      - name: Test published GFM corpus ingestion
        run: python3 -B -m unittest discover -s tools -p 'test_gfm_corpus.py' -v
      - name: Check approved GFM profile fixture contract
        run: python3 -B tools/gfm_profile.py --check
      - name: Test GFM profile source contracts and refusal controls
        run: python3 -B -m unittest discover -s tools -p 'test_gfm_profile.py' -v
      - name: Test actual GFM runner and strict comparator regressions
        run: python3 -B -m unittest discover -s tools -p 'test_gfm_conformance.py' -v
      - name: Require complete approved GFM parser profile
        run: python3 -B tools/gfm_profile.py --run --require-approved-profile
      - name: Check pinned Unicode folding table
        run: python3 -B tools/unicode_casefold.py --check
      - name: Check pinned HTML entity table
        run: python3 -B tools/html_entities.py --check
      - name: Test CommonMark corpus tooling
        run: python3 -B -m unittest discover -s tools -p 'test_commonmark_corpus.py' -v
      - name: Require complete CommonMark conformance
        run: python3 -B tools/commonmark_conformance.py --require-complete
      - name: Test CommonMark transport, ratchet, and full upstream conformance
        run: python3 -B -m unittest discover -s tools -p 'test_commonmark_conformance.py' -v

  cli-platform:
    # These execute actual host binaries. Cross-vet is a separate compile check;
    # no additional native publication adapter is enabled by this matrix.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
    steps:
      # Source overlays and documentation fences are checkout artifacts, not
      # runtime Markdown input. Preserve repository LF on Windows as elsewhere.
      - name: Preserve checked-in source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Identify actual runtime and native adapter prerequisites
        run: go env GOOS GOARCH CGO_ENABLED
      - name: Verify native confined resource reads and root selection
        run: go test ./internal/resource -run "^(TestFilesystem|TestNative)" -count=1 -v -timeout=5m
      - name: Verify compiled native paths, streams, real interrupts and capabilities
        run: go test ./cmd/mdchk -run "^(TestCompiledPlatform.*|TestCompiledCLIReadinessJourney|TestCLIReadinessStateOracle|TestExecutableStatuses|TestExecutableClosedOutputPipe|TestCompiledOrdinaryUnsupportedApply|TestCompiledApplyNoCGOClearlyRefuses|TestCompiledFixHelpWithoutProject|TestCompiledMetadataPolicy|TestCompiledArgumentOrderingAndLiteralMetadataPaths|TestCompiledBuildVersionPropagation|TestCompiledInspectionWorkflow|TestConfigurationValidationWorkflow)$" -count=1 -v -timeout=15m
      - name: Verify compiled GFM selection, consumers and native publication
        run: go test ./cmd/mdchk -run "^TestCompiledGFM" -count=1 -v -timeout=5m
      - name: Verify compiled editor and documented integration contracts
        run: go test ./internal/cli -run "^(TestCompiledEditor.*|TestDocumented.*|TestEditorRealCommandWriterFailuresAndBounds|TestEditorCommandArgumentsAndIndependentLifetime|TestValidateActualTinyReportingDeadline|TestValidateCompletedReportingAssertions|TestValidateExpiredReportingContextPreservesActualCounts)$" -count=1 -v -timeout=15m

  vulnerabilities:
    # Independent of tests so scheduled scans still run when another gate fails.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Scan complete Go module for applicable vulnerabilities
        run: sh tools/vulncheck.sh
      - name: Verify vulnerability gate detects findings and scanner failures
        run: sh tools/vulncheck.sh --self-test

  race:
    # Go's race detector requires a supported OS/architecture, a C compiler and
    # CGO. This Ubuntu amd64 runner supplies GCC; unsupported hosts must report
    # race checks as unavailable rather than counting an ordinary test as a pass.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Test with race detector
        run: go test -race ./...
      - name: Test actual GFM AST adapter with race detector
        run: go test -race -tags mdchk_conformance ./internal/conformance/... -count=1
      - name: Test closed GFM production admission with race detector
        run: go test -race -tags mdchk_conformance ./internal/cli -run '^TestGFMPrivateScopesPreserveProductionAdmission$' -count=1

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzParse
          - FuzzGFMProfile
          - FuzzInlineTextProvenance
          - FuzzReferenceRegistry
          - FuzzListMarkerSourceFacts
          - FuzzListContinuationOwnership
          - FuzzListGroupingBoundaries
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
      FUZZ_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Bounded parser fuzz smoke or scheduled campaign
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          budget=10s
          if [ "$EVENT_NAME" = schedule ]; then
            budget=5m
          fi
          go test ./internal/parser -run '^$' -fuzz "^${FUZZ_TARGET}$" -fuzztime="$budget" -parallel=2 -timeout=12m
      - name: Retain minimized failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failures-${{ matrix.target }}-${{ github.run_id }}
          path: internal/parser/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 30
