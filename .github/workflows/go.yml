name: Go

on:
  # Branches are checked through their pull requests, so a branch push does not
  # run the same commit twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

# A newer push to a pull request supersedes its older run. Every other run gets
# its own group, so each main commit and scheduled scan completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Check resource schema with ECMAScript regex engine
        run: node tools/resource_schema.mjs
      - name: Test
        env:
          DEBUG: ${{ runner.debug }}
        run: go run ./tools/testrun ./...
      - name: Build without cgo
        # Apply is portable Go: no build may require a C toolchain.
        run: CGO_ENABLED=0 go build ./...
      - name: Compile every apply target and the unsupported-host fallback
        # go vet type-checks tests as well. freebsd is outside linux, darwin and
        # windows and must compile to the explicit unsupported-platform refusal.
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64 windows/arm64 freebsd/amd64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go vet ./...
          done
      - name: Test actual GFM AST adapter and scope controls
        env:
          DEBUG: ${{ runner.debug }}
        run: go run ./tools/testrun -tags mdchk_conformance ./internal/conformance/... -count=1
      - name: Test closed GFM scopes preserve production admission
        env:
          DEBUG: ${{ runner.debug }}
        run: go run ./tools/testrun -tags mdchk_conformance ./internal/cli -run '^TestGFMPrivateScopesPreserveProductionAdmission$' -count=1
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: sh tools/lint.sh
      - name: Verify lint gate detects violations
        run: sh tools/lint.sh --self-test
      - name: Check CommonMark corpus
        run: python3 -B tools/commonmark_corpus.py --check
      - name: Check pinned published GFM corpus
        run: python3 -B tools/gfm_corpus.py --check
      - name: Test published GFM corpus ingestion
        env:
          DEBUG: ${{ runner.debug }}
        run: sh tools/unittest.sh discover -s tools -p 'test_gfm_corpus.py'
      - name: Check approved GFM profile fixture contract
        run: python3 -B tools/gfm_profile.py --check
      - name: Test GFM profile source contracts and refusal controls
        env:
          DEBUG: ${{ runner.debug }}
        run: sh tools/unittest.sh discover -s tools -p 'test_gfm_profile.py'
      - name: Test actual GFM runner and strict comparator regressions
        env:
          DEBUG: ${{ runner.debug }}
        run: sh tools/unittest.sh discover -s tools -p 'test_gfm_conformance.py'
      - name: Require complete approved GFM parser profile
        run: python3 -B tools/gfm_profile.py --run --require-approved-profile
      - name: Check pinned Unicode folding table
        run: python3 -B tools/unicode_casefold.py --check
      - name: Check pinned IDNA tables
        run: python3 -B tools/unicode_idna.py --check
      - name: Check pinned HTML entity table
        run: python3 -B tools/html_entities.py --check
      - name: Test CommonMark corpus tooling
        env:
          DEBUG: ${{ runner.debug }}
        run: sh tools/unittest.sh discover -s tools -p 'test_commonmark_corpus.py'
      - name: Require complete CommonMark conformance
        run: python3 -B tools/commonmark_conformance.py --require-complete
      - name: Test CommonMark transport, ratchet, and full upstream conformance
        env:
          DEBUG: ${{ runner.debug }}
        run: sh tools/unittest.sh discover -s tools -p 'test_commonmark_conformance.py'
      # Vulnerability scans run even when an earlier gate fails, so scheduled
      # scans still report.
      - name: Scan complete Go module for applicable vulnerabilities
        if: ${{ !cancelled() }}
        run: sh tools/vulncheck.sh
      - name: Verify vulnerability gate detects findings and scanner failures
        if: ${{ !cancelled() }}
        run: sh tools/vulncheck.sh --self-test

  cli-platform:
    name: cli-platform (${{ matrix.os }})
    # Paused: this job does not run for now. Remove this condition to revive it.
    if: false
    # These execute actual host binaries. Cross-vet is a separate compile check.
    # Apply is one portable implementation, so the same suite runs on every OS
    # with CGO_ENABLED=0. Linux runs these tests in the test and race jobs.
    strategy:
      fail-fast: false
      matrix:
        # The compiled tests mostly wait on the processes they launch, so
        # Windows runs more of them at once than it has CPUs.
        include:
          - os: macOS
            runner: macos-26
            parallel: 6
          - os: Windows
            runner: windows-2025
            parallel: 8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
    steps:
      # Source overlays and documentation fences are checkout artifacts, not
      # runtime Markdown input. Preserve repository LF on Windows as elsewhere.
      - name: Preserve checked-in source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Identify actual runtime and native adapter prerequisites
        run: go env GOOS GOARCH CGO_ENABLED
      - name: Verify native confined resource reads and root selection
        # Resource-backed integration providers must execute on the real host;
        # pure integration policy tests are not part of this native filter.
        env:
          DEBUG: ${{ runner.debug }}
        run: go run ./tools/testrun ./internal/resource ./internal/integration -run "^(TestFilesystem|TestNative)" -count=1 -timeout=5m
      - name: Verify compiled native paths, streams, real interrupts and capabilities
        # The expanded native suite reached the fifteen-minute limit on Windows.
        # Keep room for the complete inventory and later native integration gates.
        env:
          DEBUG: ${{ runner.debug }}
        run: go run ./tools/testrun ./cmd/mdchk -run "^(TestCompiledPlatform.*|TestCompiledCLIReadinessJourney|TestCLIReadinessStateOracle|TestExecutableStatuses|TestExecutableClosedOutputPipe|TestCompiledOrdinaryApply|TestCompiledApplyNoCGOApplies|TestCompiledFixHelpWithoutProject|TestCompiledMetadataPolicy|TestCompiledArgumentOrderingAndLiteralMetadataPaths|TestCompiledBuildVersionPropagation|TestCompiledInspectionWorkflow|TestConfigurationValidationWorkflow)$" -count=1 -parallel=${{ matrix.parallel }} -timeout=20m
      - name: Verify portable apply adapter without cgo
        env:
          CGO_ENABLED: "0"
          DEBUG: ${{ runner.debug }}
        run: |
          go run ./tools/testrun ./internal/fsroot ./internal/files ./internal/fix -count=1 -timeout=10m
          go run ./tools/testrun ./internal/cli -run "^(TestApply.*|TestFrontmatterApplyPreservesHeaderAndConverges|TestFrontmatterOperationParityNativeApply|TestGitHubActualPartialSavedPublication|TestVSCodeActualPartialSavedPublication)$" -count=1 -timeout=10m
      - name: Verify compiled apply without cgo
        env:
          CGO_ENABLED: "0"
          DEBUG: ${{ runner.debug }}
        run: go run ./tools/testrun ./cmd/mdchk -run "^(TestCompiledProductionMD047ApplySavedWorkflow|TestCompiledApply.*|TestCompiledEditorPartialNativePublication|TestCompiledProductionMD051ResourceFragmentsApplySavedView|TestCompiledGFMNativeSavedBytes)$" -count=1 -timeout=15m
      - name: Verify compiled GFM selection, consumers and native publication
        env:
          DEBUG: ${{ runner.debug }}
        run: go run ./tools/testrun ./cmd/mdchk -run "^TestCompiledGFM" -count=1 -timeout=5m
      - name: Verify compiled editor and documented integration contracts
        env:
          DEBUG: ${{ runner.debug }}
        run: go run ./tools/testrun ./internal/cli -run "^(TestCompiledEditor.*|TestDocumented.*|TestEditorRealCommandWriterFailuresAndBounds|TestEditorCommandArgumentsAndIndependentLifetime|TestValidateActualTinyReportingDeadline|TestValidateCompletedReportingAssertions|TestValidateExpiredReportingContextPreservesActualCounts)$" -count=1 -timeout=15m

  race:
    name: race (${{ matrix.os }})
    # Go's race detector requires a supported OS/architecture, a C compiler and
    # CGO. This Ubuntu amd64 runner supplies GCC; unsupported hosts must report
    # race checks as unavailable rather than counting an ordinary test as a pass.
    # Only Linux runs for now; add hosts here when cross-OS race coverage is
    # needed, provided they meet the requirements above.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test with race detector
        # The full native acceptance suite exceeds Go's default ten-minute
        # package timeout under race instrumentation.
        env:
          DEBUG: ${{ runner.debug }}
        run: go run ./tools/testrun -race -timeout=20m ./...
      - name: Test actual GFM AST adapter with race detector
        env:
          DEBUG: ${{ runner.debug }}
        run: go run ./tools/testrun -race -tags mdchk_conformance ./internal/conformance/... -count=1
      - name: Test closed GFM production admission with race detector
        env:
          DEBUG: ${{ runner.debug }}
        run: go run ./tools/testrun -race -tags mdchk_conformance ./internal/cli -run '^TestGFMPrivateScopesPreserveProductionAdmission$' -count=1

  fuzz:
    # Pushes and pull requests smoke every parser fuzz target in one job. The
    # weekly campaign gives each target its own runner and a longer budget.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'schedule' && fromJSON('["FuzzParse","FuzzGFMProfile","FuzzInlineTextProvenance","FuzzReferenceRegistry","FuzzListMarkerSourceFacts","FuzzListContinuationOwnership","FuzzListGroupingBoundaries"]') || fromJSON('["all"]') }}
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
      FUZZ_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Bounded parser fuzz smoke or scheduled campaign
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          budget=10s
          if [ "$EVENT_NAME" = schedule ]; then
            budget=5m
          fi
          targets=$FUZZ_TARGET
          if [ "$targets" = all ]; then
            targets=$(go test ./internal/parser -list '^Fuzz' | grep '^Fuzz')
          fi
          for target in $targets; do
            echo "== $target"
            go test ./internal/parser -run '^$' -fuzz "^${target}$" -fuzztime="$budget" -parallel=2 -timeout=12m
          done
      - name: Retain minimized failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failures-${{ matrix.target }}-${{ github.run_id }}
          path: internal/parser/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 30
