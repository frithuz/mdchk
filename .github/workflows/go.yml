name: Go

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Check CommonMark corpus
        run: python3 -B tools/commonmark_corpus.py --check
      - name: Check pinned Unicode folding table
        run: python3 -B tools/unicode_casefold.py --check
      - name: Test CommonMark corpus tooling
        run: python3 -B -m unittest discover -s tools -p 'test_commonmark_corpus.py' -v
      - name: Run staged CommonMark regression gate
        run: python3 -B tools/commonmark_conformance.py
      - name: Test CommonMark renderer transport and ratchet
        run: python3 -B -m unittest discover -s tools -p 'test_commonmark_conformance.py' -v
